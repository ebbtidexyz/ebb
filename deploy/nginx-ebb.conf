# Ebb on the saltbound VPS.
server {
    listen 80;
    server_name ebbtide.xyz;
    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.ebbtide.xyz;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # streaming chat completions
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# www and the old sslip.io names redirect to the canonical domain
server {
    listen 80;
    server_name www.ebbtide.xyz ebb.187-127-98-242.sslip.io;
    return 301 https://ebbtide.xyz$request_uri;
}

server {
    listen 80;
    server_name api-ebb.187-127-98-242.sslip.io;
    return 301 https://api.ebbtide.xyz$request_uri;
}
